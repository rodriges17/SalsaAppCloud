<style>
#sbs-status-prototype {font-family:Inter,system-ui,sans-serif; color-scheme:light dark; --sbs-logo:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIiBmaWxsPSJjdXJyZW50Q29sb3IiPjxjaXJjbGUgY3g9IjM5IiBjeT0iMTciIHI9IjciLz48Y2lyY2xlIGN4PSI2MSIgY3k9IjI1IiByPSI3Ii8+PHBhdGggZD0iTTEwIDIxQzIyIDMxIDM0IDI1IDQ1IDM2QzU5IDQ5IDM5IDY0IDEwIDkxQzE3IDY5IDM0IDU4IDQzIDQ4QzUyIDM3IDE3IDQxIDEwIDIxWiIvPjxwYXRoIGQ9Ik01NCAzN0M2NiA0MiA3OCAzOSA5MCAzMEM4NiA0MyA3NSA0OSA2MCA0OVoiLz48cGF0aCBkPSJNNTcgNDZDNzcgNjEgNTkgNzcgNDIgOTZDMzkgODEgNTMgNjYgNTkgNThDNjMgNTMgNTggNTAgNTcgNDZaIi8+PHBhdGggZD0iTTY2IDYzQzc3IDcyIDgyIDg0IDg1IDk0Qzc0IDg2IDY2IDc4IDYwIDczWiIvPjwvc3ZnPgo=');--sbs-bg:light-dark(#f8f2ea,#17121f);--sbs-card:light-dark(#fffcf8,#292132);--sbs-text:light-dark(#34271f,#f3edf7);--sbs-muted:light-dark(#6c5b50,#bfb2cb);--sbs-accent:light-dark(#9d3f2b,#cfb4f6);--sbs-border:light-dark(#d5c4b5,#51445f);--sbs-soft:light-dark(#efcfbf,#483554);--sbs-edit:light-dark(#93402c,#ffbc9c);--sbs-green:light-dark(#326437,#b6dca8);color:var(--sbs-text)}
#sbs-status-prototype * {box-sizing:border-box}
#sbs-status-prototype [data-variant] {min-height:884px;padding:16px 8px}
#sbs-status-prototype .sbs-phone {max-width:410px;margin:auto;background:var(--sbs-bg);border:1px solid var(--sbs-border);border-radius:22px;overflow:hidden;position:relative;min-height:840px;display:flex;flex-direction:column;box-shadow:0 8px 24px #00000014}
#sbs-status-prototype button,#sbs-status-prototype input {font:inherit;color:inherit}
#sbs-status-prototype button {border:0;background:none;min-height:44px;border-radius:9px;padding:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
#sbs-status-prototype button:focus-visible,#sbs-status-prototype input:focus-visible {outline:2px solid var(--sbs-accent);outline-offset:2px}
#sbs-status-prototype svg {width:18px;height:18px;stroke-width:1.7;flex-shrink:0}
#sbs-status-prototype .sbs-shell {padding:20px 16px 10px}
#sbs-status-prototype .sbs-brand {display:flex;align-items:center;gap:11px}
#sbs-status-prototype .sbs-mark {height:48px;width:42px;flex-shrink:0;background:currentColor;color:var(--sbs-accent);mask:var(--sbs-logo) center/contain no-repeat}
#sbs-status-prototype .sbs-brand b {display:block;font-size:25px;font-weight:500;letter-spacing:-.7px}
#sbs-status-prototype .sbs-tagline {color:var(--sbs-muted);font-size:11px;display:block;margin-top:2px}
#sbs-status-prototype .sbs-settings {margin-left:auto;color:var(--sbs-muted);width:44px}
#sbs-status-prototype .sbs-heading {display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
#sbs-status-prototype h2 {font-size:20px;font-weight:500;margin:0}
#sbs-status-prototype .sbs-add {background:var(--sbs-accent);color:var(--sbs-bg);width:44px}
#sbs-status-prototype .sbs-search {display:flex;align-items:center;gap:9px;border:1px solid var(--sbs-border);border-radius:9px;padding:0 11px;height:44px;color:var(--sbs-muted)}
#sbs-status-prototype input {width:100%;min-width:0;background:transparent;border:0;min-height:42px;font-size:16px;outline-offset:0}
#sbs-status-prototype input::placeholder {color:var(--sbs-muted)}
#sbs-status-prototype .sbs-filters {display:flex;gap:4px;margin:7px 0}
#sbs-status-prototype .sbs-filters button {font-size:12px;padding:5px 10px;white-space:nowrap}
#sbs-status-prototype .sbs-filters [aria-pressed=true] {background:var(--sbs-soft);color:var(--sbs-accent)}
#sbs-status-prototype .sbs-count {font-size:12px;color:var(--sbs-muted);display:flex;justify-content:space-between;padding-top:4px}
#sbs-status-prototype .sbs-list {padding:0 12px 12px;display:grid;gap:10px}
#sbs-status-prototype .sbs-card {background:var(--sbs-card);border:1px solid color-mix(in srgb,var(--sbs-border) 55%,transparent);border-radius:14px;position:relative;overflow:hidden}
#sbs-status-prototype .sbs-main {display:flex;align-items:center;gap:12px;padding:13px 12px 6px}
#sbs-status-prototype .sbs-thumb-wrap {position:relative;align-self:center;flex-shrink:0}
#sbs-status-prototype .sbs-thumb {width:78px;height:88px;border-radius:9px;background:linear-gradient(145deg,color-mix(in srgb,var(--sbs-edit) 28%,var(--sbs-bg)),var(--sbs-soft));display:grid;place-items:center;position:relative;overflow:hidden;color:var(--sbs-text)}
#sbs-status-prototype .sbs-thumb:before {content:'';position:absolute;inset:6px 16px;opacity:.14;background:currentColor;mask:var(--sbs-logo) center/contain no-repeat}
#sbs-status-prototype .sbs-thumb svg {width:25px;height:25px;z-index:1}
#sbs-status-prototype .sbs-copy {min-width:0;flex:1;padding-right:19px}
#sbs-status-prototype .sbs-title {text-align:left;padding:0;min-height:24px;justify-content:flex-start;font-weight:500;font-size:16px;line-height:1.35}
#sbs-status-prototype .sbs-learning {display:table;color:var(--sbs-accent);background:var(--sbs-soft);font-size:11px;border-radius:5px;padding:3px 7px;margin:6px 0}
#sbs-status-prototype .sbs-learning[data-learning=Sitzt] {color:var(--sbs-green);background:color-mix(in srgb,var(--sbs-green) 12%,var(--sbs-card))}
#sbs-status-prototype .sbs-tags {font-size:11px;color:var(--sbs-muted);margin-top:7px}
#sbs-status-prototype .sbs-meta {font-size:11px;color:var(--sbs-muted);margin-top:7px;display:block;white-space:nowrap}
#sbs-status-prototype .sbs-menu {position:absolute;top:5px;right:0;width:32px;min-height:44px;color:var(--sbs-muted)}
#sbs-status-prototype .sbs-source {color:var(--sbs-muted);font-size:11px;padding:0;min-height:44px;justify-content:flex-start;text-align:left}
#sbs-status-prototype .sbs-source[data-source=modified] {color:var(--sbs-edit)}
#sbs-status-prototype .sbs-compound {position:relative;display:inline-flex;min-width:23px;height:22px;align-items:center}
#sbs-status-prototype .sbs-compound svg:last-child {position:absolute;right:-2px;bottom:-1px;width:12px;height:12px;background:var(--sbs-card);border-radius:2px;stroke-width:2}
#sbs-status-prototype .sbs-inline-meta {display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--sbs-muted);min-height:40px}
#sbs-status-prototype .sbs-inline-meta .sbs-source {min-height:40px;gap:5px}
#sbs-status-prototype .sbs-inline-meta svg {width:16px;height:16px}
#sbs-status-prototype .sbs-picture-badge {position:absolute;right:-5px;bottom:-5px;width:44px;min-height:44px;justify-content:center;border:3px solid var(--sbs-card);border-radius:12px;background:var(--sbs-bg);padding:0;box-shadow:0 2px 6px #00000016}
#sbs-status-prototype .sbs-picture-badge .sbs-compound svg:last-child {background:var(--sbs-bg)}
#sbs-status-prototype [data-layout=picture] .sbs-main {padding-bottom:16px;min-height:124px}
#sbs-status-prototype [data-layout=picture] .sbs-thumb {height:90px}
#sbs-status-prototype .sbs-status-row {border-top:1px solid color-mix(in srgb,var(--sbs-border) 55%,transparent);margin:7px 12px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
#sbs-status-prototype .sbs-status-row .sbs-meta {margin:0}
#sbs-status-prototype [data-layout=strip] .sbs-main {padding-bottom:0}
#sbs-status-prototype .sbs-nav {margin-top:auto;display:flex;background:var(--sbs-bg);border-top:1px solid var(--sbs-border);padding:5px 18px}
#sbs-status-prototype .sbs-nav button {flex:1;flex-direction:column;font-size:11px;gap:4px;color:var(--sbs-muted)}
#sbs-status-prototype .sbs-nav button[aria-current=page] {color:var(--sbs-accent);background:var(--sbs-soft)}
#sbs-status-prototype .sbs-nav .sbs-mark {height:20px;width:20px}
#sbs-status-prototype .sbs-sheet {position:absolute;bottom:0;left:0;right:0;padding:20px;background:var(--sbs-card);border-top:1px solid var(--sbs-border);box-shadow:0 -12px 60px #00000040;z-index:5;min-height:175px;border-radius:20px 20px 0 0}
#sbs-status-prototype .sbs-sheet [data-close] {float:right;width:44px;margin:-9px -7px 0 10px}
#sbs-status-prototype .sbs-sheet h3 {font-weight:500;font-size:17px;margin:0 0 10px}
#sbs-status-prototype .sbs-sheet p {font-size:14px;line-height:1.6;margin:0;color:var(--sbs-muted)}
#sbs-status-prototype .sbs-prototype-label {max-width:410px;margin:0 auto 9px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--sbs-muted)}
#sbs-status-prototype .sbs-prototype-label span {text-transform:uppercase;letter-spacing:1px}
#sbs-status-prototype [hidden] {display:none!important}
@media(max-width:370px){#sbs-status-prototype [data-variant]{padding:12px 0;min-height:884px}#sbs-status-prototype .sbs-shell{padding-inline:13px}#sbs-status-prototype .sbs-thumb{width:66px;height:82px}#sbs-status-prototype .sbs-main{gap:9px;padding-inline:10px}#sbs-status-prototype .sbs-copy{padding-right:16px}#sbs-status-prototype .sbs-inline-meta{gap:4px}}
</style>
<div id="sbs-status-prototype" class="viz-carousel viz-dotted-background" aria-label="Platzierung des Figurenstatus" data-previous-label="Vorheriger Vorschlag" data-next-label="Nächster Vorschlag">
<section data-variant="Metazeile" data-layout="meta" aria-label="Status als Teil der Metazeile"><div class="sbs-prototype-label"><span>Prototyp</span> Metazeile · Empfehlung</div><div class="sbs-phone"></div></section>
<section data-variant="Am Vorschaubild" data-layout="picture" aria-label="Status am Vorschaubild" hidden><div class="sbs-prototype-label"><span>Prototyp</span> Am Vorschaubild</div><div class="sbs-phone"></div></section>
<section data-variant="Statusleiste" data-layout="strip" aria-label="Eigene Statusleiste unter der Figur" hidden><div class="sbs-prototype-label"><span>Prototyp</span> Eigene Statusleiste</div><div class="sbs-phone"></div></section>
</div>
<script>
(() => {
 const root=document.getElementById('sbs-status-prototype');
 const examples=[{title:'Setenta y cuatro',learning:'Am Üben',tags:'',time:'0:52',videos:1,state:'cloud'},{title:'Italiana',learning:'Am Üben',tags:'',time:'1:09',videos:2,state:'local'},{title:'Cross Body mit Drehung',learning:'Neu',tags:'Salsa · Kombination',time:'1:08',videos:1,state:'modified'}];
 const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const sourceIcon=state=>state==='local'?icon('smartphone'):state==='cloud'?icon('cloud'):`<span class="sbs-compound">${icon('cloud')}${icon('pencil')}</span>`;
 const label={local:'Nur lokal',cloud:'Cloud',modified:'Lokal angepasst'};
 const explanation={local:'Diese Figur ist nur auf diesem Gerät gespeichert.',cloud:'Diese Figur wurde aus der Cloud übernommen oder von dir dort gespeichert.',modified:'Diese Figur stammt aus der Cloud. Titel, Beschreibung, Tags oder Videos wurden danach lokal angepasst. Dein Lernstatus zählt nicht als Anpassung.'};
 const source=(f,extra='')=>`<button type="button" class="sbs-source cursor-interaction ${extra}" data-source="${f.state}" data-details="${f.state}" aria-label="${label[f.state]} – Details anzeigen">${sourceIcon(f.state)}${extra?'':`<span>${label[f.state]}</span>`}</button>`;
 for(const stage of root.querySelectorAll('[data-variant]')){
  const layout=stage.dataset.layout,phone=stage.querySelector('.sbs-phone');
  phone.innerHTML=`<div class="sbs-shell"><header class="sbs-brand"><span class="sbs-mark" aria-hidden="true"></span><div><b>Step by Step</b><span class="sbs-tagline">Deine Schritte. Dein Tempo.</span></div><button type="button" class="sbs-settings cursor-interaction" aria-label="Einstellungen">${icon('settings')}</button></header><div class="sbs-heading"><h2>Meine Figuren</h2><button type="button" class="sbs-add cursor-interaction" aria-label="Figur hinzufügen">${icon('plus')}</button></div><label class="sbs-search">${icon('search')}<input type="search" placeholder="Figur suchen" aria-label="Figur suchen"></label><div class="sbs-filters" aria-label="Lernstand filtern">${['Alle','Neu','Am Üben','Sitzt'].map((v,i)=>`<button type="button" class="cursor-interaction" aria-pressed="${i===0}" data-filter="${v}">${v}</button>`).join('')}</div><div class="sbs-count"><span data-count>3 Figuren</span><span>Sortierung: Neueste</span></div></div><div class="sbs-list">${examples.map(f=>`<article class="sbs-card" data-learning="${f.learning}" data-title="${f.title.toLowerCase()}"><div class="sbs-main"><div class="sbs-thumb-wrap"><div class="sbs-thumb" aria-hidden="true">${icon('circle-play')}</div>${layout==='picture'?source(f,'sbs-picture-badge'):''}</div><div class="sbs-copy"><button type="button" class="sbs-title cursor-interaction" data-preview="${f.title}">${f.title}</button><span class="sbs-learning" data-learning="${f.learning}">${f.learning}</span>${f.tags?`<div class="sbs-tags">${f.tags}</div>`:''}<span class="sbs-meta">Geräteordner · Documents</span>${layout==='meta'?`<div class="sbs-inline-meta"><span>${f.time} · ${f.videos} Video${f.videos===1?'':'s'}</span><span aria-hidden="true">·</span>${source(f)}</div>`:layout==='picture'?`<span class="sbs-meta">${f.time} · ${f.videos} Video${f.videos===1?'':'s'}</span>`:''}</div><button type="button" class="sbs-menu cursor-interaction" aria-label="Optionen für ${f.title}" data-preview="${f.title}">${icon('ellipsis-vertical')}</button></div>${layout==='strip'?`<div class="sbs-status-row">${source(f)}<span class="sbs-meta">${f.time} · ${f.videos} Video${f.videos===1?'':'s'}</span></div>`:''}</article>`).join('')}</div><nav class="sbs-nav" aria-label="Hauptnavigation"><button type="button" aria-current="page" class="cursor-interaction"><span class="sbs-mark" aria-hidden="true"></span>Figuren</button><button type="button" class="cursor-interaction" data-cloud>${icon('cloud')}Cloud-Speicher</button></nav><section class="sbs-sheet" aria-live="polite" hidden><button type="button" data-close class="cursor-interaction" aria-label="Schließen">${icon('x')}</button><h3></h3><p></p></section>`;
  const sheet=phone.querySelector('.sbs-sheet');
  const show=(heading,message)=>{sheet.querySelector('h3').textContent=heading;sheet.querySelector('p').textContent=message;sheet.hidden=false;};
  phone.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.hasAttribute('data-details'))show(label[button.dataset.details],explanation[button.dataset.details]);else if(button.hasAttribute('data-close'))sheet.hidden=true;else if(button.hasAttribute('data-preview'))show(button.dataset.preview,'Vorschau im Prototyp. Deine gespeicherten Figuren bleiben unverändert.');else if(button.hasAttribute('data-cloud'))show('Cloud-Speicher','Hier würdest du deine Cloudfiguren und Bibliotheken öffnen.');else if(button.classList.contains('sbs-add'))show('Figur hinzufügen','Im Prototyp sind drei Beispiel-Figuren vorbereitet.');else if(button.classList.contains('sbs-settings'))show('Einstellungen','Dies ist eine Vorschau der Figurenübersicht.');});
  let selected='Alle';const filter=()=>{const query=phone.querySelector('input').value.trim().toLowerCase();let count=0;phone.querySelectorAll('.sbs-card').forEach(card=>{card.hidden=(selected!=='Alle'&&card.dataset.learning!==selected)||!card.dataset.title.includes(query);if(!card.hidden)count++;});phone.querySelector('[data-count]').textContent=`${count} Figuren`;};
  phone.querySelector('input').addEventListener('input',filter);
  phone.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.filter;phone.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));filter();}));
 }
 if(window.lucide)lucide.createIcons({attrs:{width:18,height:18}});
})();
</script>
