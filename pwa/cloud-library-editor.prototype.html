function thumb(f,i){return '<span class="thumb c'+(i%4+1)+'"><img src="'+art+'" alt=""></span>'}
function status(f){return '<span class="availability '+(f.local?'ready':'')+'" title="'+(f.local?'Lokal verfügbar':'Noch nicht lokal gespeichert')+'">'+svg(f.local?'cloud':'down')+'<span class="status-label">'+(f.local?'Lokal':'Cloud')+'</span></span>'}
function row(f,i){return '<article class="figure '+(openId===f.id?'open':'')+'"><button class="summary" data-action="expand" data-id="'+f.id+'" aria-expanded="'+(openId===f.id)+'"><span class="num">'+(i+1)+'</span>'+thumb(f,i)+'<span class="figure-copy"><span class="figure-title">'+esc(f.title)+'</span><span class="figure-sub" style="display:block">'+f.duration+' · '+f.level+'</span></span>'+status(f)+'<span class="chevron">'+svg('chev')+'</span></button>'+(openId===f.id?'<div class="expanded"><p>'+esc(f.description)+'</p><div class="tags">'+f.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div><div class="video-demo"><img src="'+art+'" alt="">'+btn(svg('play'),'play','', 'aria-label="Videovorschau simulieren"')+'<span>Videovorschau · Simulation · '+f.duration+'</span></div><div class="actions">'+btn(svg(f.local?'check':'down')+' '+(f.local?'Lokal verfügbar':'Lokal verfügbar machen'),'download','', 'data-id="'+f.id+'" '+(f.local?'disabled':''))+'</div></div>':'')+'</article>'}
function editRow(f,i){return '<article class="figure edit-row" data-row="'+f.id+'"><span class="num">'+(i+1)+'</span>'+thumb(f,i)+'<span class="figure-title">'+esc(f.title)+'</span><div class="edit-controls"><button class="grip" data-grip="'+f.id+'" aria-label="'+esc(f.title)+' verschieben" title="Ziehen oder Pfeiltasten">⠿</button>'+btn('↑','up','','data-id="'+f.id+'" aria-label="'+esc(f.title)+' nach oben" '+(!i?'disabled':''))+btn('↓','down','','data-id="'+f.id+'" aria-label="'+esc(f.title)+' nach unten" '+(i===draft.ids.length-1?'disabled':''))+btn('×','remove','','data-id="'+f.id+'" aria-label="'+esc(f.title)+' aus Bibliothek entfernen"')+'</div></article>'}
function share(){return '<section class="share"><h3>'+svg('link')+' Bibliothek teilen</h3><p>'+(saved.visibility==='public'?'Dieser Link ist ohne Anmeldung lesbar.':'Nur berechtigte, angemeldete Personen können diese Bibliothek öffnen.')+'</p><div class="linkline"><input readonly aria-label="Bibliothekslink" value="https://stepbystep.app/bibliothek/salsa-grundlagen">'+btn('Link kopieren','copy')+'</div></section>'}
function banner(){const available=saved.ids.filter(id=>figure(id).local).length;return '<section class="download-banner"><div><h3>Auch ohne Internet üben</h3><p>'+available+' von '+saved.ids.length+' Figuren bereits lokal verfügbar</p></div>'+btn(svg('down')+' Alle Figuren lokal verfügbar machen','all')+'</section>'}
function title(){return '<p class="eyebrow">'+(saved.visibility==='public'?'Öffentliche Bibliothek':'Private Bibliothek')+'</p><div class="titlebar"><h1>'+esc(saved.title)+'</h1>'+(role!=='guest'?btn(svg('edit')+' Bearbeiten','edit'):'' )+'</div><p class="intro">'+esc(saved.description)+'</p><div class="meta"><span>'+saved.ids.length+' Figuren</span><span class="dot"></span><span>Von Patrick</span></div>'}
function list(edit=false){const ids=edit?draft.ids:saved.ids;return '<div class="list-head"><h2>Figuren</h2><span>'+(edit?'Ziehen oder mit Pfeilen verschieben':'In Bibliotheksreihenfolge')+'</span></div><section class="figure-list" aria-label="Figurenliste">'+ids.map((id,i)=>edit?editRow(figure(id),i):row(figure(id),i)).join('')+(ids.length?'':'<p class="muted">Noch keine Figuren. Füge deine ersten Cloud-Figuren hinzu.</p>')+'</section>'}
function settings(){return '<details class="settings" '+(variant==='B'||tab==='settings'?'open':'')+'><summary>Einstellungen <span>⌄</span></summary><div class="fields"><label>Name<input data-field="title" value="'+esc(draft.title)+'"></label><label>Beschreibung<textarea data-field="description">'+esc(draft.description)+'</textarea></label><label>Sichtbarkeit<select data-field="visibility"><option value="public" '+(draft.visibility==='public'?'selected':'')+'>Öffentlich</option><option value="private" '+(draft.visibility==='private'?'selected':'')+'>Privat</option></select></label><p class="muted" style="font-size:11px">'+(draft.visibility==='public'?'Öffentliche Bibliotheken sind auch für Gäste lesbar.':'Der Zugriff bleibt auf berechtigte Benutzer beschränkt.')+'</p></div></details>'}
function savebar(){return '<div class="savebar"><span id="dirtyLabel">'+(dirty()?'Ungespeicherte Änderungen':'Noch keine Änderungen')+'</span><div>'+btn('Abbrechen','cancel')+btn('Bibliothek speichern','save','primary')+'</div></div>'}
function editList(){return '<div class="editbar"><div><h2>Figuren verwalten</h2><p>Neue Figuren erscheinen am Ende.</p></div>'+btn(svg('plus')+' Figuren hinzufügen','add')+'</div>'+list(true)}
function render(){document.body.className='variant-'+variant;document.getElementById('variantLabel').innerHTML='<small>Klickbarer Prototyp · '+(variant==='D'?'Deine Auswahl':'Vergleich')+'</small><strong>'+variant+' · '+names[variant]+'</strong>';const app=document.getElementById('app');let html='';
if(screen==='home'){html='<p class="eyebrow">Cloud-Speicher</p><h1 style="margin-top:10px">Bibliotheken</h1><p class="intro" style="margin-top:12px">Öffentliche Kurse entdecken und lokal üben.</p><div class="catalog">'+btn('<strong>'+esc(saved.title)+'</strong><span>'+saved.ids.length+' Figuren · Von Patrick</span>','open')+'</div>'}
else if(!draft){html=btn('‹ Alle Bibliotheken','home','back textbtn');if(variant==='B')html+='<div class="read-layout"><aside>'+title()+banner()+'</aside><div>'+list()+share()+'</div></div>';else if(variant==='C'||variant==='D')html+='<section class="hero">'+title()+banner()+'</section>'+list()+share();else html+=title()+banner()+list()+share();}
else{html=btn('‹ Zur Bibliothek','cancel','back textbtn')+'<p class="eyebrow">Bearbeitungsmodus</p><h1 style="margin-top:8px">Bibliothek bearbeiten</h1><div class="editor-flag">'+svg('edit')+'<span>Änderungen werden erst mit „Bibliothek speichern“ übernommen.</span></div>'+(error?'<div class="error">Die Bibliothek wurde inzwischen von jemand anderem geändert. Dein Entwurf wurde nicht gespeichert.<br>'+btn('Aktuellen Stand neu laden','reload')+'</div>':'');if(variant==='B')html+='<div class="edit-layout"><div>'+editList()+'</div><aside class="editor-side">'+settings()+savebar()+'</aside></div>';else if(variant==='C'||variant==='D')html+='<nav class="tabs">'+btn('Figuren ('+draft.ids.length+')','figures',tab==='figures'?'selected':'')+btn('Einstellungen','settings',tab==='settings'?'selected':'')+'</nav>'+(tab==='figures'?editList():settings())+savebar();else html+=editList()+settings()+savebar();}
html+='<details class="screen-state"><summary>Prototyp-Zustand anzeigen</summary><pre>'+esc(JSON.stringify({ansicht:role,modus:draft?'Bearbeiten':'Lesen',gespeichert:saved.ids.map(id=>figure(id).title),entwurf:draft?.ids.map(id=>figure(id).title)??null,ungespeichert:!!dirty(),cloudFiguren:cloud.length,konfliktSimulation:conflict},null,2))+'</pre></details>';app.innerHTML=html;wireDrag();}
function notify(text){const t=document.getElementById('toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3500)}
function showModal(html){const m=document.getElementById('modal');m.innerHTML=html;m.oncancel=null;m.showModal();return m}
function closeModal(){document.getElementById('modal').close()}
function save(){if(!draft)return true;if(!draft.title.trim()){notify('Bitte einen Bibliotheksnamen eingeben.');return false}if(conflict){error=true;render();return false}saved=structuredClone(draft);saved.version++;draft=null;error=false;openId=null;tab='figures';render();notify('Bibliothek gespeichert.');return true}
async function leave(action){if(!dirty()){draft=null;error=false;action();return}showModal('<h2>Änderungen speichern?</h2><p>Deine Änderungen an dieser Bibliothek sind noch nicht gespeichert.</p><div class="dialog-actions">'+btn('Weiter bearbeiten','stay')+btn('Verwerfen','discard')+btn('Speichern','leave-save','primary')+'</div>');const m=document.getElementById('modal');m._after=action;}
function addPicker(){showModal('<h2>Figuren hinzufügen</h2><p>Wähle aus „Meine Cloud-Figuren“. Neue Figuren werden hinten angefügt.</p>'+cloud.map((f,i)=>'<label class="pick"><input type="checkbox" value="'+f.id+'" '+(draft.ids.includes(f.id)?'checked disabled':'')+'>'+thumb(f,i)+'<span>'+esc(f.title)+'<small style="display:block">'+(draft.ids.includes(f.id)?'Bereits in der Bibliothek':f.duration+' · '+f.level)+'</small></span></label>').join('')+btn(svg('plus')+' Neue Figur hochladen','upload','textbtn uploadlink')+'<div class="dialog-actions">'+btn('Abbrechen','close-modal')+btn('Auswahl hinzufügen','apply-add','primary')+'</div>')}
let dragging=null;
function move(id,offset,to=null){if(!draft)return;const i=draft.ids.indexOf(id),j=to??i+offset;if(i<0||j<0||j>=draft.ids.length||i===j)return;draft.ids.splice(i,1);draft.ids.splice(j,0,id);render()}
function wireDrag(){document.querySelectorAll('[data-grip]').forEach(h=>{h.onpointerdown=e=>{if(e.button!==0)return;dragging=h.dataset.grip;e.preventDefault();h.closest('article').classList.add('dragging')};h.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();move(h.dataset.grip,e.key==='ArrowUp'?-1:1);document.querySelector('[data-grip="'+h.dataset.grip+'"]').focus()}}})}
document.addEventListener('pointermove',e=>{if(!dragging||!draft)return;const row=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-row]');if(row&&row.dataset.row!==dragging)move(dragging,0,draft.ids.indexOf(row.dataset.row));if(e.clientY<130)window.scrollBy(0,-12);if(e.clientY>innerHeight-130)window.scrollBy(0,12)});document.addEventListener('pointerup',()=>{dragging=null;document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'))});document.addEventListener('pointercancel',()=>dragging=null);
document.addEventListener('input',e=>{if(e.target.dataset.field&&draft){draft[e.target.dataset.field]=e.target.value;const d=document.getElementById('dirtyLabel');if(d)d.textContent=dirty()?'Ungespeicherte Änderungen':'Noch keine Änderungen'}});
function changeVariant(direction){leave(()=>{variant=['A','B','C','D'][(['A','B','C','D'].indexOf(variant)+direction+4)%4];const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);openId=null;render();window.scrollTo(0,0)})}
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.target.closest('input,textarea,select,[contenteditable],[data-grip]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();changeVariant(e.key==='ArrowLeft'?-1:1)}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;switch(a){case'expand':openId=openId===id?null:id;render();break;case'edit':draft=structuredClone(saved);openId=null;tab='figures';render();break;case'cancel':await leave(()=>{render();notify('Zur Leseansicht zurückgekehrt.')});break;case'save':save();break;case'up':move(id,-1);break;case'down':move(id,1);break;case'remove':draft.ids=draft.ids.filter(x=>x!==id);render();notify('Zuordnung zum Entfernen vorgemerkt. Die Cloud-Figur bleibt erhalten.');break;case'add':addPicker();break;case'apply-add':for(const c of document.querySelectorAll('#modal input:checked:not(:disabled)'))if(!draft.ids.includes(c.value))draft.ids.push(c.value);closeModal();render();notify('Figuren vorgemerkt. Jetzt Bibliothek speichern.');break;case'upload':closeModal();showModal('<h2>Neue Figur hochladen</h2><p>Simulierter bestehender Upload-Ablauf. Die Figur bleibt nach dem Upload in „Meine Cloud-Figuren“, auch wenn du die Bibliotheksbearbeitung abbrichst.</p><div class="fields"><label>Name<input id="uploadName" value="Neue Salsa-Kombination"></label><label>Beschreibung<textarea id="uploadDescription">Eine neue Kombination für unseren Kurs.</textarea></label></div><div class="dialog-actions">'+btn('Zurück zur Auswahl','back-picker')+btn('Upload simulieren','upload-done','primary')+'</div>');break;case'upload-done':{const f={id:'upload-'+Date.now(),title:document.getElementById('uploadName').value||'Neue Figur',duration:'2:15',level:'Neu hochgeladen',description:document.getElementById('uploadDescription').value,tags:['Salsa'],local:false};cloud.push(f);draft.ids.push(f.id);closeModal();render();notify('In Meine Cloud-Figuren gespeichert; Bibliothekszuordnung vorgemerkt.');break}case'back-picker':closeModal();addPicker();break;case'close-modal':closeModal();break;case'stay':closeModal();break;case'discard':{const after=document.getElementById('modal')._after;closeModal();draft=null;error=false;after?.();break}case'leave-save':{const after=document.getElementById('modal')._after;closeModal();if(save())after?.();break}case'reload':showModal('<h2>Aktuellen Stand laden?</h2><p>Deine Bibliotheksänderungen werden verworfen. Hochgeladene Cloud-Figuren bleiben erhalten.</p><div class="dialog-actions">'+btn('Weiter bearbeiten','close-modal')+btn('Neu laden','reload-confirm','primary')+'</div>');break;case'reload-confirm':closeModal();conflict=false;document.getElementById('conflict').checked=false;saved.version++;draft=structuredClone(saved);error=false;render();notify('Aktuellen Stand geladen.');break;case'copy':notify('Bibliothekslink kopiert (Simulation).');break;case'download':figure(id).local=true;render();notify('Figur mit Lernstatus „Neu“ lokal übernommen (Simulation).');break;case'all':{b.disabled=true;b.textContent='Fehlende Figuren werden gespeichert …';setTimeout(()=>{saved.ids.forEach(id=>figure(id).local=true);render();notify('Alle Figuren lokal verfügbar. Vorhandene Videos übersprungen (Simulation).')},900);break}case'play':b.innerHTML=svg('check');notify('Videowiedergabe ist im Prototyp simuliert.');break;case'home':await leave(()=>{screen='home';render();window.scrollTo(0,0)});break;case'leave':await leave(()=>{screen='home';render();notify('Navigation zu Meine Figuren ist hier simuliert.')});break;case'open':screen='library';render();break;case'figures':tab='figures';render();break;case'settings':tab='settings';render();break;case'prev':changeVariant(-1);break;case'next':changeVariant(1);break;case'tools':document.getElementById('tools').hidden=!document.getElementById('tools').hidden;break;case'reset':closeModal();reset();notify('Beispieldaten zurückgesetzt.');break}});
document.getElementById('role').onchange=e=>{const next=e.target.value;e.target.value=role;leave(()=>{role=next;e.target.value=next;screen='library';render()})};document.getElementById('theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;document.getElementById('conflict').onchange=e=>{conflict=e.target.checked;render()};reset();
</script></body></html>
