#shareVideos { border: 0; padding: 0; max-height: 35dvh; overflow-y: auto; }
.share-choice { display: flex; align-items: center; gap: .75rem; padding: .65rem 0; overflow-wrap: anywhere; }
.share-choice input { width: 1.4rem; height: 1.4rem; flex-shrink: 0; accent-color: var(--lavender); }

#importChoiceDialog input[type=file] { display: block; width: 100%; margin: 16px 0; min-height: 52px; }
.update-notice { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px; margin: 12px 0; border: 1px solid var(--lavender); border-radius: 12px; }

.cloud-scroll { overflow-y: auto; flex: 1; padding: 16px max(16px,calc((100% - 720px)/2)); }
#cloudBody { display: grid; gap: 16px; }
.cloud-card { display: grid; gap: 12px; border: 1px solid var(--border); border-radius: 15px; padding: 16px; overflow-wrap: anywhere; }
.cloud-card form { display: grid; gap: 12px; }
.cloud-card label { display: grid; gap: 8px; color: var(--lavender); }
.cloud-card input:not([type=checkbox]), .cloud-card textarea, .cloud-card select { width: 100%; min-width: 0; }
.cloud-card .cloud-check { display: flex; align-items: center; gap: 10px; }
.cloud-check input { width: 24px; min-height: 24px; flex-shrink: 0; }
.cloud-card video { width: 100%; max-height: 45dvh; background: #000; }
.cloud-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.backup-body { display:grid; gap:16px; }
.backup-body label { display:grid; gap:8px; }
.backup-body input,.backup-body select { max-width:100%; width:100%; }
.backup-body .cloud-card { margin-block:12px; }
.backup-download { display:block; text-align:center; padding:14px; border:1px solid var(--border); border-radius:12px; text-decoration:none; color:inherit; }
.backup-body p { overflow-wrap:anywhere; }

.backup-actions { display:grid; gap:12px; margin-block:16px; }
.backup-actions button { width:100%; }

.figure-card.needs-folder-access { flex-wrap:wrap; }
.folder-access-action { flex-basis:100%; margin-top:4px; }

.cloud-history summary { cursor: pointer; padding: 12px 0; font-weight: 600; }
.cloud-history > .cloud-card { margin-top: 12px; }
.cloud-history h4 { margin: 0; }

    <footer class="save-footer"><p id="cloudStatus" role="status"></p><button id="cloudCancelUpload" class="secondary" hidden>Upload abbrechen</button></footer><nav class="bottom-nav" aria-label="Hauptnavigation"><button type="button" data-nav="figures"><svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><circle cx="39" cy="17" r="7"/><circle cx="61" cy="25" r="7"/><path d="M10 21C22 31 34 25 45 36C59 49 39 64 10 91C17 69 34 58 43 48C52 37 17 41 10 21Z"/><path d="M54 37C66 42 78 39 90 30C86 43 75 49 60 49Z"/><path d="M57 46C77 61 59 77 42 96C39 81 53 66 59 58C63 53 58 50 57 46Z"/><path d="M66 63C77 72 82 84 85 94C74 86 66 78 60 73Z"/></svg><span>Figuren</span></button><button type="button" data-nav="cloud" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18a4 4 0 0 1-.5-8 6.5 6.5 0 0 1 12.4-1.8A5 5 0 0 1 18 18H6Z"/></svg><span>Cloud-Speicher</span></button></nav>
  </dialog><script>
// PROTOTYPE ONLY. UI hierarchy for guests; all content and actions are in-memory examples.
const libraries=[{id:'basics',name:'Salsa Grundlagen',description:'Dein Einstieg: Grundschritte, Rhythmus und die ersten Figuren.',count:12,level:'Für den Einstieg',symbol:'♧',figures:['Grundschritt','Cross Body Lead','Rechtsdrehung']},{id:'turns',name:'Drehungen & Kombinationen',description:'Drehungen sauber aufbauen und fließend miteinander verbinden.',count:18,level:'Mit Vorkenntnissen',symbol:'↻',figures:['Linksdrehung','Inside Turn','Cross Body Kombination']},{id:'bachata',name:'Bachata zum Üben',description:'Grundlagen und kleine Kombinationen für deine nächste Tanzrunde.',count:9,level:'Für alle',symbol:'♫',figures:['Seitlicher Grundschritt','Drehung im Paar','Wechsel & Pause']}];
const variants={A:'Bibliothekskarten',B:'Kompakte Bibliotheksliste',C:'Entdecken mit Empfehlung'};
const params=new URLSearchParams(location.search);let variant=variants[params.get('variant')]?params.get('variant'):'A';
let state={screen:'libraries',library:null,loginOpen:false,method:'link',query:'',theme:'dark',authenticated:false,personal:false},local=new Set(['basics:0']);
const dialog=document.getElementById('cloudDialog'),body=document.getElementById('cloudBody');
const labels=document.createElement('div');labels.className='prototype-label';labels.innerHTML='<strong>PROTOTYP</strong><span>Beispieldaten</span><button id="authPreviewToggle">Ansicht: Gast ▾</button><button id="themeToggle">Hell anzeigen</button>';dialog.querySelector('.screen-header').after(labels);
const switcher=document.createElement('nav');switcher.className='prototype-switcher';switcher.setAttribute('aria-label','Prototyp-Varianten');switcher.innerHTML='<button aria-label="Vorherige Variante" data-cycle="-1">←</button><span class="variant-copy"><strong id="variantLabel"></strong><small>Varianten vergleichen · 1 / 3</small></span><button aria-label="Nächste Variante" data-cycle="1">→</button>';dialog.append(switcher);
const sheet=document.createElement('section');sheet.className='sheet-cover';sheet.hidden=true;sheet.setAttribute('aria-label','Anmelden');dialog.append(sheet);
const toast=document.createElement('p');toast.className='prototype-toast';toast.setAttribute('role','status');toast.hidden=true;dialog.append(toast);let toastTimer;
function notify(text){toast.textContent=text;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,3400)}
function relevantState(){return {variant,...state,localVideos:[...local]}}
function printState(){console.info('Prototyp-Zustand',relevantState());const el=document.getElementById('prototypeState');if(el)el.textContent='Gast · '+(state.screen==='libraries'?'Öffentliche Bibliotheken':libraries.find(l=>l.id===state.library)?.name)+' · Anmeldung '+(state.loginOpen?'geöffnet':'zugeklappt')}
function loginForm(){return '<div class="login-inner"><p>Für private Bibliotheken und berechtigte Konten. Öffentliche Bibliotheken kannst du direkt nutzen.</p><div class="login-tabs"><button data-method="link" aria-pressed="'+(state.method==='link')+'">Mit Anmeldelink</button><button data-method="admin" aria-pressed="'+(state.method==='admin')+'">Admin-Anmeldung</button></div>'+(state.method==='link'?'<form><label>Persönlicher Anmeldelink<input type="text" inputmode="url" placeholder="Anmeldelink einfügen" autocomplete="off" required></label><button type="submit">Anmelden</button></form><p>Den persönlichen Link erhältst du vom Administrator.</p>':'<form><label>E-Mail-Adresse<input type="email" placeholder="admin@beispiel.ch" autocomplete="off" required></label><label>Passwort<input type="password" placeholder="Dein Passwort" autocomplete="off" required></label><button type="submit">Als Admin anmelden</button></form><p>Erstes Passwort oder Passwort vergessen? Verwende deinen persönlichen Anmeldelink.</p>')+'<small>Nur ausprobieren: Es werden keine Zugangsdaten übertragen. Bitte Beispielwerte verwenden.</small></div>'}
function disclosure(compact=false){return '<details class="guest-login"'+(state.loginOpen?' open':'')+'><summary>'+(compact?'Private Bibliotheken oder Verwaltung?':'Anmelden')+'<span>'+(compact?'Anmeldemöglichkeiten öffnen':'Für private Bibliotheken und Verwaltung')+'</span></summary>'+loginForm()+'</details>'}
function footerLink(){return '<button class="login-link" data-open-login><span><strong>Du hast ein Konto?</strong><small>Private Bibliotheken und Verwaltung</small></span><span>Anmelden ›</span></button>'}
function card(lib){return '<article class="library-card"><div class="library-top"><span class="library-symbol" aria-hidden="true">'+lib.symbol+'</span><span class="public-tag">Öffentlich</span></div><h4>'+lib.name+'</h4><p>'+lib.description+'</p><span class="count">'+lib.count+' Figuren · '+lib.level+'</span><button class="secondary" data-library="'+lib.id+'">Bibliothek öffnen</button></article>'}
function row(lib){return '<button class="directory-row" data-library="'+lib.id+'"><span class="library-symbol" aria-hidden="true">'+lib.symbol+'</span><span><strong>'+lib.name+'</strong><small>'+lib.count+' Figuren · '+lib.level+'</small></span><span class="arrow" aria-hidden="true">›</span></button>'}
function intro(title,description){return '<div class="guest-intro"><div><h3>'+title+'</h3><p>'+description+'</p></div><button aria-label="Bibliotheken aktualisieren" data-refresh>↻</button></div><p class="prototype-state" id="prototypeState" hidden></p>'}
function renderLibraries(){
 let content='';
 if(variant==='A')content=intro('Öffentliche Bibliotheken','Entdecke Figuren und übernimm sie zum Üben auf dein Gerät.')+'<div class="library-grid">'+libraries.map(card).join('')+'</div>'+disclosure();
 if(variant==='B')content=intro('Bibliotheken entdecken','Öffentliche Figuren. Direkt ansehen und auf deinem Gerät üben.')+'<input id="librarySearch" class="search-library" type="search" aria-label="Öffentliche Bibliotheken durchsuchen" placeholder="Bibliotheken suchen"><div class="library-directory" id="directory">'+libraries.map(row).join('')+'</div>'+footerLink();
 if(variant==='C'){const featured=libraries[0];content=intro('Was möchtest du üben?','Öffentliche Bibliotheken für deine nächsten Tanzschritte.')+'<article class="feature"><span class="eyebrow">Für deinen Einstieg</span><h4>'+featured.name+'</h4><p>'+featured.description+'</p><div class="feature-meta"><span>12 Figuren</span><span>Für den Einstieg</span><span class="public-tag">Öffentlich</span></div><button data-library="basics">Grundlagen entdecken</button></article><p class="browse-label">Weitere öffentliche Bibliotheken</p><div class="compact-list">'+libraries.slice(1).map(row).join('')+'</div>'+disclosure(true)}
 body.innerHTML=content;
 if(state.authenticated)body.querySelectorAll('.guest-login,.login-link').forEach(element=>element.remove());
 const search=document.getElementById('librarySearch');if(search){search.value=state.query;filterLibraries()}
}
function filterLibraries(){const q=state.query.toLocaleLowerCase();const matches=libraries.filter(l=>(l.name+' '+l.description).toLocaleLowerCase().includes(q));document.getElementById('directory').innerHTML=matches.length?matches.map(row).join(''):'<p class="empty-public">Keine Bibliothek gefunden. Probiere einen anderen Suchbegriff.</p>'}
function renderDetail(){const lib=libraries.find(l=>l.id===state.library);body.innerHTML='<button class="detail-top" data-back-libraries>‹ Alle öffentlichen Bibliotheken</button>'+intro(lib.name,lib.description)+'<p class="browse-label">'+lib.count+' Figuren · Öffentlich · Auswahl als Beispiel</p><div class="demo-figures">'+lib.figures.map((name,i)=>'<article class="demo-figure"><h4>'+name+'</h4><p>Video zum Lernen · '+(i+1)+':24 min</p>'+(local.has(lib.id+':'+i)?'<span class="local-pill">✓ Bereits lokal vorhanden</span>':'<button class="secondary" data-take="'+lib.id+':'+i+'">In meine Figuren übernehmen</button>')+'</article>').join('')+'</div>'+(state.authenticated?'':variant==='B'?footerLink():disclosure(variant==='C'));}
function renderSheet(){sheet.hidden=!(state.loginOpen&&variant==='B');if(!sheet.hidden)sheet.innerHTML='<div class="sheet-card"><header><h3>Anmelden</h3><button data-close-login aria-label="Anmeldung schließen">✕</button></header>'+loginForm()+'</div>'}
function render(){body.className='variant-'+variant;if(state.authenticated&&state.personal)renderPersonal();else if(state.screen==='libraries')renderLibraries();else renderDetail();renderAccountNavigation();renderSheet();document.getElementById('variantLabel').textContent=variant+' · '+variants[variant];switcher.querySelector('small').textContent='Varianten vergleichen · '+(['A','B','C'].indexOf(variant)+1)+' / 3';printState();}
function cycle(direction){const keys=['A','B','C'];variant=keys[(keys.indexOf(variant)+direction+3)%3];const u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);state={...state,screen:'libraries',library:null,loginOpen:false,personal:false,query:''};render();dialog.querySelector('.cloud-scroll').scrollTop=0;}
dialog.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;
 if(b.dataset.cycle){cycle(Number(b.dataset.cycle));return}
 if(b.dataset.library){state.screen='detail';state.personal=false;state.library=b.dataset.library;state.loginOpen=false;render();dialog.querySelector('.cloud-scroll').scrollTop=0;return}
 if(b.hasAttribute('data-back-libraries')){state.screen='libraries';state.library=null;render();return}
 if(b.hasAttribute('data-open-login')){state.loginOpen=true;renderSheet();printState();sheet.querySelector('input')?.focus();return}
 if(b.hasAttribute('data-close-login')){state.loginOpen=false;renderSheet();printState();return}
 if(b.dataset.method){state.method=b.dataset.method;if(variant==='B')renderSheet();else{const scroll=dialog.querySelector('.cloud-scroll').scrollTop;render();dialog.querySelector('.cloud-scroll').scrollTop=scroll}printState();return}
 if(b.dataset.take){local.add(b.dataset.take);render();notify('Demo: Video übernommen. In der App folgt vorher die Video-Bestätigung.');return}
 if(b.hasAttribute('data-refresh'))notify('Demo: Alle öffentlichen Bibliotheken sind aktuell.');
});
dialog.addEventListener('input',event=>{if(event.target.id==='librarySearch'){state.query=event.target.value;filterLibraries();printState()}});
dialog.addEventListener('toggle',event=>{if(event.target.matches?.('.guest-login')){state.loginOpen=event.target.open;printState()}},true);
dialog.addEventListener('submit',event=>{event.preventDefault();event.target.reset();state.authenticated=true;state.personal=false;state.loginOpen=false;state.screen='libraries';render();notify('Demo: angemeldet. Der Bereichswechsel ist jetzt verfügbar. Es wurden keine Daten gesendet.');printState()});
sheet.addEventListener('click',event=>{if(event.target===sheet){state.loginOpen=false;renderSheet();printState()}});
document.getElementById('themeToggle').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;document.getElementById('themeToggle').textContent=state.theme==='dark'?'Hell anzeigen':'Dunkel anzeigen';printState()};
function home(){dialog.close();state.loginOpen=false;sheet.hidden=true;printState()}
document.getElementById('cloudBack').onclick=()=>{if(state.screen==='detail'){state.screen='libraries';state.library=null;state.loginOpen=false;render()}else home()};
dialog.addEventListener('cancel',event=>{event.preventDefault();if(state.loginOpen&&variant==='B'){state.loginOpen=false;renderSheet()}else home()});
dialog.querySelectorAll('[data-nav=figures]').forEach(b=>b.onclick=home);dialog.querySelectorAll('[data-nav=cloud]').forEach(b=>b.onclick=()=>{state.screen='libraries';state.library=null;state.loginOpen=false;render()});
document.getElementById('openPrototypeCloud').onclick=()=>{dialog.showModal();render()};
window.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable=true]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowLeft'?-1:1)}});

function renderPersonal(){body.innerHTML=intro('Meine Cloud-Figuren','Deine eigenen Figuren, unabhängig von Bibliothekszuordnungen.')+'<div class="demo-figures"><article class="demo-figure"><h4>Meine erste Kombination</h4><p>Eigene Cloud-Figur · 2 Videos · Beispieldaten</p><button class="secondary" data-demo-own>Figur öffnen</button></article><article class="demo-figure"><h4>Cross Body mit Drehung</h4><p>Eigene Cloud-Figur · 1 Video · Beispieldaten</p><button class="secondary" data-demo-own>Figur öffnen</button></article></div>'}
function renderAccountNavigation(){
 document.getElementById('authPreviewToggle').textContent=state.authenticated?'Ansicht: Angemeldet ▾':'Ansicht: Gast ▾';
 if(!state.authenticated)return;
 const nav=document.createElement('nav');nav.className='account-switch';nav.setAttribute('aria-label','Cloud-Bereiche');
 nav.innerHTML='<button data-account-area="personal" aria-pressed="'+state.personal+'">Meine Figuren</button><button data-account-area="libraries" aria-pressed="'+!state.personal+'">Bibliotheken</button>';
 body.prepend(nav);
 nav.addEventListener('click',event=>{const button=event.target.closest('[data-account-area]');if(!button)return;state.personal=button.dataset.accountArea==='personal';state.screen='libraries';state.library=null;state.loginOpen=false;render();dialog.querySelector('.cloud-scroll').scrollTop=0;});
}
document.getElementById('authPreviewToggle').onclick=()=>{
 state.authenticated=!state.authenticated;state.personal=false;state.screen='libraries';state.library=null;state.loginOpen=false;render();dialog.querySelector('.cloud-scroll').scrollTop=0;
};
dialog.addEventListener('click',event=>{if(event.target.closest('[data-demo-own]'))notify('Demo: Hier öffnet sich deine eigene Cloud-Figur.')});

dialog.showModal();render();
</script></body></html>
