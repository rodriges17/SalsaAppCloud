name: SalsaTrainer
options:
  bundleIdPrefix: com.rodriges17
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    APP_GROUP: group.com.rodriges17.SalsaTrainer
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SalsaTrainer:
    type: application
    platform: iOS
    sources: [SalsaTrainer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rodriges17.SalsaTrainer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
    dependencies:
      - target: SalsaShare
    scheme:
      testTargets: [SalsaTrainerTests, SalsaTrainerUITests]
      gatherCoverageData: true
  SalsaShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SalsaShare
      - path: SalsaTrainer
        excludes: [App.swift, Player.swift, TestFixtures.swift, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rodriges17.SalsaTrainer.Share
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Config/Share-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SHARE_EXTENSION
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  SalsaTrainerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SalsaTrainerTests]
    dependencies:
      - target: SalsaTrainer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rodriges17.SalsaTrainer.Tests
  SalsaTrainerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SalsaTrainerUITests]
    dependencies:
      - target: SalsaTrainer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rodriges17.SalsaTrainer.UITests
